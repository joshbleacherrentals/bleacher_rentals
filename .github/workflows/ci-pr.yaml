name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

  changelog:
    runs-on: ubuntu-latest
    # Only gate promotions into the deployable branches.
    if: contains(fromJSON('["develop","staging","main"]'), github.base_ref)

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch target branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check version bump and release notes
        run: npx tsx scripts/changelog/checkChangelog.cli.ts ${{ github.base_ref }}

  preflight:
    runs-on: ubuntu-latest
    # Same gate as the changelog job: only promotions into a deployable branch
    # need evidence that someone clicked through the release.
    if: contains(fromJSON('["develop","staging","main"]'), github.base_ref)

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check this version was preflighted
        run: npx tsx scripts/preflight/checkPreflight.cli.ts

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0

      - name: Start Supabase local development setup
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Run database tests
        run: supabase test db

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --local > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
